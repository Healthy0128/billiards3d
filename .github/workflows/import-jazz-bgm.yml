name: Import CC0 jazz BGM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-jazz-bgm.yml'

permissions:
  contents: write

jobs:
  import-bgm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CC0 jazz track
        run: |
          mkdir -p assets/audio/bgm
          curl -L --fail --retry 3 \
            'https://opengameart.org/sites/default/files/jazz_improv_looped_2.mp3' \
            -o assets/audio/bgm/jazz-improv-looped-cc0.mp3
          test -s assets/audio/bgm/jazz-improv-looped-cc0.mp3
          file assets/audio/bgm/jazz-improv-looped-cc0.mp3

      - name: Commit imported audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/bgm/jazz-improv-looped-cc0.mp3
          git diff --cached --quiet && exit 0
          git commit -m 'Add CC0 jazz BGM recording'
          git push origin HEAD:main
