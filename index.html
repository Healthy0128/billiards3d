<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07130f" />
  <title>3D Billiards</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <header class="hud topbar">
      <div>
        <div class="title">3D BILLIARDS</div>
        <div id="status" class="status">右下の照準パッドで狙いを合わせます</div>
      </div>
      <div class="actions">
        <button id="modeBtn">練習</button>
        <button id="guideBtn">GUIDE ON</button>
        <button id="musicBtn">JAZZ OFF</button>
        <button id="cameraBtn">視点</button>
        <button id="soundBtn">SOUND ON</button>
        <button id="resetBtn">ラック</button>
      </div>
    </header>

    <div id="matchHud" class="hud match-hud hidden">
      <div id="p1Card" class="player active"><span>PLAYER 1</span><b id="p1Group">OPEN</b></div>
      <div id="gameLabel" class="versus">8 BALL</div>
      <div id="p2Card" class="player"><span>PLAYER 2</span><b id="p2Group">OPEN</b></div>
    </div>

    <div id="fineAim" class="hud fine-aim">
      <button id="aimLeftBtn" aria-label="左へ微調整">◀</button>
      <span id="angleText">0.0°</span>
      <button id="aimRightBtn" aria-label="右へ微調整">▶</button>
    </div>

    <div class="hud control-dock">
      <div class="spin-wrap compact-panel">
        <div class="control-label">CUE BALL <span id="spinText">CENTER</span></div>
        <div id="spinPad" class="spin-pad" aria-label="撞点">
          <div class="spin-cross h"></div><div class="spin-cross v"></div>
          <div id="spinDot" class="spin-dot"></div>
        </div>
      </div>

      <div class="power-column compact-panel">
        <div class="control-label">POWER <span id="powerText">35%</span></div>
        <input id="powerControl" type="range" min="0" max="100" value="35" />
        <button id="shootBtn" class="shoot-btn">SHOT</button>
        <button id="ballInHandBtn" class="confirm-btn hidden">手球位置を確定</button>
      </div>

      <div class="aim-wrap compact-panel">
        <div class="control-label">AIM <span id="aimHint">SWIPE</span></div>
        <div id="aimPad" class="aim-pad">
          <div class="aim-center"></div>
          <div class="aim-caption">左右にスワイプ</div>
        </div>
      </div>
    </div>

    <div class="hud help">照準パッド＝方向　◀▶＝微調整　撞点＝回転　POWER＝強さ　SHOT＝撞く</div>
  </div>
  <script type="module" src="./src/main6.js"></script>
</body>
</html>
