<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07130f" />
  <title>3D Billiards</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <header class="hud topbar">
      <div>
        <div class="title">3D BILLIARDS</div>
        <div id="status" class="status">ドラッグして狙い、離してショット</div>
      </div>
      <div class="actions">
        <button id="resetBtn">ラック</button>
        <button id="cameraBtn">視点</button>
        <button id="soundBtn">SOUND ON</button>
      </div>
    </header>
    <div class="hud power-wrap">
      <div class="label">POWER</div>
      <div class="power"><div id="powerFill"></div></div>
    </div>
    <div class="hud help">PC: 左ドラッグでショット / ホイールでズーム　スマホ: 1本指ドラッグでショット</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
